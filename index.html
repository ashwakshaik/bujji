<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-card">
    <div class="heading">
      <h1>Create Account</h1>
      <p>Fill in your details to register</p>
    </div>

    <form id="registrationForm">
      <div class="field">
        <label for="fullname">Suji Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
               pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>
      </div>

      <div class="field">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" required>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="8" required>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms" required>
        <span>I agree to the terms and conditions</span>
      </label>

      <button type="submit">Register</button>
      <p id="message" class="message" role="status"></p>
    </form>
    <p class="login-text">Already have an account? <a href="#">Log in</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
